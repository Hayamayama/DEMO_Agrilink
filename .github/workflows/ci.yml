name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # Every *.test.js under backend/ (tests/, test/ and services/). PGlite runs the real
      # migrations in-process, so no database service is needed.
      - name: Test
        run: npm test

      # Boots server.js without a database and checks the frontend, the API envelope and 503s.
      - name: Smoke
        run: npm run smoke
