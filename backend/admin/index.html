<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriLink Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main><h1>AgriLink Admin</h1><p id="message">Sign in with an administrator account.</p><section id="login"><label>Phone number<input id="phone" inputmode="numeric" autocomplete="username"></label><label>6-digit PIN<input id="pin" inputmode="numeric" type="password" maxlength="6" autocomplete="current-password"></label><button id="loginButton">Sign in</button></section><section id="dashboard" hidden><div class="toolbar"><button id="refresh">Refresh</button><button id="logout">Sign out</button></div><h2>Service settings</h2><label class="switch"><input id="maintenance" type="checkbox"> Maintenance mode</label><label>Welcome message<input id="welcome" maxlength="160"></label><button id="saveSettings">Save settings</button><h2>Members</h2><div id="users"></div></section></main><script type="module" src="/admin/admin.js"></script></body></html>
