server {
    listen 80;
    listen [::]:80;
    server_name demo-203-116-30-130.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo-203-116-30-130.sslip.io;

    ssl_certificate /etc/letsencrypt/live/demo-203-116-30-130.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo-203-116-30-130.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
